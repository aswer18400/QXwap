name: Preview Browser Matrix

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target preview or production URL"
        required: true
        default: "https://aswer18400.github.io/QXwap"

concurrency:
  group: preview-browser-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-matrix:
    name: Browser matrix (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run preview browser proof
        env:
          E2E_WEB_BASE: ${{ inputs.target_url }}
        run: pnpm exec playwright test tests/qa/production-preview-matrix.spec.js --reporter=line --browser=${{ matrix.browser }}

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-browser-matrix-${{ matrix.browser }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
