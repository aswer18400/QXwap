<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#115e59" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>QXwap</title>
    <script>
      (function () {
        const url = new URL(window.location.href);
        const route = url.searchParams.get("p");
        if (!route) return;
        const basePath = window.location.pathname.replace(/\/$/, "");
        const nextPath = `${basePath}${route.startsWith("/") ? route : `/${route}`}`.replace(/\/{2,}/g, "/");
        const nextQuery = url.searchParams.get("q");
        window.history.replaceState(null, "", `${nextPath}${nextQuery ? `?${nextQuery}` : ""}${window.location.hash}`);
      })();
      window.API_BASE = window.API_BASE || "";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
